<style>
:root{--bg:#1B120B;--card:#241809;--gold:#D9A441;--rust:#C1502E;--cream:#F4E9D8;--muted:#B8A78D;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--cream);}
.wrap{max-width:900px;margin:auto;padding:0 22px;}
header{padding:20px 0;display:flex;justify-content:space-between;align-items:center;}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--gold);}
nav a{color:var(--muted);margin-left:18px;font-size:13.5px;text-decoration:none;}
.hero{padding:50px 0 60px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(217,164,65,.12),transparent 60%);}
.tag{display:inline-block;background:rgba(217,164,65,.15);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-size:clamp(32px,6vw,52px);line-height:1.1;}
h1 em{color:var(--rust);font-style:italic;}
.hero p{color:var(--muted);max-width:440px;margin:18px auto 0;font-size:15px;}
.btn{display:inline-block;margin-top:26px;background:var(--rust);color:white;padding:13px 26px;border-radius:4px;font-weight:600;text-decoration:none;font-size:14.5px;}
.menu{padding:50px 0;border-top:1px solid rgba(217,164,65,.15);}
.menu h2{font-family:'Fraunces',serif;font-size:26px;text-align:center;margin-bottom:30px;color:var(--gold);}
.dish{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px dashed rgba(184,167,141,.25);}
.dish h3{font-size:15.5px;font-weight:600;}
.dish p{color:var(--muted);font-size:12.5px;margin-top:4px;}
.price{font-family:'Fraunces',serif;color:var(--gold);font-weight:600;white-space:nowrap;}
footer{text-align:center;padding:40px 0;color:var(--muted);font-size:12.5px;border-top:1px solid rgba(217,164,65,.15);}
</style>
